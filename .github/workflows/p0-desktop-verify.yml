name: P0 · Desktop offline render

# P0 feasibility gate for the DW-shorts desktop build (plan §8 / §13).
# On each platform it builds a minimal bundle (local Whisper CT2 dir + YOLO
# weights + bundled ffmpeg), then runs main.py --skip-analysis fully offline and
# asserts the clip is produced with NO network/download activity.
#
# This is the single most important pre-build check: it proves the local
# dependency stack (ctranslate2, torch/ultralytics, mediapipe, PyAV, ffmpeg)
# works on the real rendering path on both targets before any Electron code
# exists.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop_runtime.py'
      - 'main.py'
      - 'app.py'
      - 'scripts/**'
      - '.github/workflows/p0-desktop-verify.yml'

jobs:
  p0:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: '3.12'
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
          - os: windows-2022
            python: '3.12'
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (system, used to build the test clip + as the bundle copy)
        if: runner.os != 'Windows'
        run: brew install ffmpeg

      - name: Create venv and install requirements
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "VENV=$(pwd)/.venv" >> "$GITHUB_ENV"

      - name: Pre-fetch models into the bundle
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python scripts/prefetch_models.py desktop/resources small

      - name: Bundle ffmpeg
        run: |
          mkdir -p desktop/resources/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            # ffmpeg is provided by the setup-ffmpeg action below; copy it in.
            cp "$(command -v ffmpeg)" desktop/resources/bin/ffmpeg.exe
            cp "$(command -v ffprobe)" desktop/resources/bin/ffprobe.exe
          else
            cp "$(command -v ffmpeg)" desktop/resources/bin/ffmpeg
            cp "$(command -v ffprobe)" desktop/resources/bin/ffprobe
          fi

      - name: Provide ffmpeg on Windows
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Run P0 offline smoke test
        env:
          DW_SHORTS_BUNDLE: ${{ github.workspace }}/desktop/resources
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          # Strip any proxy so a silent network call would actually fail.
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          python scripts/p0_offline_smoke.py

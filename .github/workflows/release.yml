name: Build & Release DW-shorts

# Builds the DW-shorts desktop app for macOS arm64 and Windows x64, then publishes
# a STABLE (non-draft, non-prerelease) GitHub release with both installers.
# Triggered by pushing a tag like `v1.0.0`, or via workflow_dispatch (which creates
# the tag for you and lets the tag-push run do the actual build).
#
# Each platform builds natively on its own runner (electron-builder cannot
# cross-compile the signed/unsigned artifact) and uploads its installer
# straight to a DRAFT release; a final job turns that draft into the stable
# release once both installers are in.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0 (a v-prefixed tag is created)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

# One build at a time per ref. A new push cancels the previous run cleanly
# instead of leaving two runs racing for the same tag and the same Release.
concurrency:
  group: dw-shorts-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only runs for workflow_dispatch: creates the tag so the tag-push path builds.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        env:
          TAG: v${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent: -f lets this be re-dispatched for a version that
          # already has a tag, which is how you retry a build that was
          # cancelled by runner capacity without changing any code.
          git tag -f "$TAG"
          git push -f origin "$TAG"

  # Creates the DRAFT release the two platform jobs upload their installer to.
  #
  # The installers go straight to the release instead of through Actions
  # artifacts: an artifact this size (a 1 GB installer) is far past the
  # monthly artifact storage quota (500 MB on Free, 1 GB on Pro, 2 GB on
  # Team), and the intermediate copy could be evicted before the release job
  # downloaded it. A release asset has no total size limit and is stored once.
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A previous run (or a re-run) already made it: force it back to
            # a draft so the assets stay invisible until both platforms are in.
            gh release edit "$TAG" --draft=true --title "DW-shorts $TAG"
          else
            gh release create "$TAG" --draft --title "DW-shorts $TAG" --generate-notes
          fi
          gh release view "$TAG" --json isDraft,tagName --jq '"  draft=\(.isDraft) tag=\(.tagName)"'

  build-mac:
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/')
    # macos-14 (arm64) is DEPRECATED upstream, and GitHub is draining its
    # runner pool: jobs targeting it are announced as "capacity constraints"
    # and end up CANCELLED with no logs at all (no runner name, no steps).
    # macos-15 is the current GA arm64 image, so the build host stays arm64
    # and no cross-compilation is involved.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python (for the build scripts only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the macOS installer
        working-directory: desktop
        # One script does the whole thing: the deps, the bundled source tree,
        # the relocatable Python runtime, ffmpeg, the model weights, the
        # dashboard, electron-builder, the bundle check and the artifact
        # report. Keeping the CI and a developer's machine on the SAME code
        # path is the point — the two used to drift, and only the CI side was
        # ever exercised.
        run: node scripts/build-macos.mjs

      - name: Upload the macOS installer to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh desktop/dist/DW-shorts-*.dmg
          gh release upload "$TAG" desktop/dist/DW-shorts-*.dmg --clobber

  build-win:
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python (for the build scripts only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Windows installer
        working-directory: desktop
        # The same script a developer runs on their own Windows machine, so
        # a green CI run means the desktop build really works.
        run: node scripts/build-windows.mjs

      - name: Upload the Windows installer to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh desktop/dist/DW-shorts-*.exe
          gh release upload "$TAG" desktop/dist/DW-shorts-*.exe --clobber

  # Turns the draft into the stable release, once BOTH installers are in.
  release:
    needs: [build-mac, build-win]
    if: always() && needs.build-mac.result == 'success' && needs.build-win.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json isDraft,isPrerelease,assets \
            --jq '"  draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'

  # A build that failed leaves the draft behind; take it down so a broken
  # build never shows up as a half-published release.
  cleanup:
    needs: [build-mac, build-win]
    if: always() && (needs.build-mac.result != 'success' || needs.build-win.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          echo "  removed the draft release for $TAG"
